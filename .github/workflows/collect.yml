name: Collect soil temperature data

on:
  schedule:
    # GitHub cron runs in UTC. 10AM Eastern is 14:00 UTC during daylight
    # time and 15:00 UTC during standard time, so we trigger at both.
    # Minute 23 avoids the top-of-the-hour congestion that delays runs.
    # The guard step below skips whichever run finds today's row already
    # recorded, so delayed or duplicate triggers can't double-log.
    - cron: "23 14 * * *"
    - cron: "23 15 * * *"
  workflow_dispatch: {}  # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip if today already recorded
        id: guard
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - collecting regardless of existing rows"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif grep -q "^$TODAY," data/soil_temperatures.csv 2>/dev/null; then
            echo "Already have a row for $TODAY - skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No row yet for $TODAY - collecting"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Collect soil data
        if: steps.guard.outputs.run == 'true'
        run: python collect_soil_data.py

      - name: Commit and push new data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/soil_temperatures.csv
          git diff --cached --quiet || git commit -m "Add soil data for $(date +%Y-%m-%d)"
          git push
